version: "3.8"

services:
  localstack:
    container_name: localstack_main
    image: localstack/localstack:latest

    ports:
      - "4566:4566"

    environment:
      SERVICES: rds,s3
      DEBUG: 1
      DOCKER_HOST: unix:///var/run/docker.sock

    volumes:
      - ./volume/localstack:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock